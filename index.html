<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Nợ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<script src="xlsx.full.min.js" defer></script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Sổ Nợ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#000;--mute:#555;--line:#bdbdbd;--acc:#000;--accbg:#fff;--warn:#000;--warnbg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#000;--ink:#eee;--mute:#999;--line:#444;--acc:#fff;--accbg:#000;--warn:#fff;--warnbg:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#000;--ink:#eee;--mute:#999;--line:#444;--acc:#fff;--accbg:#000;--warn:#fff;--warnbg:#000;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.45 "Noto Serif",Georgia,"Times New Roman",serif}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:16px 18px 8px}
h1{font-size:22px;margin:0 0 2px;font-weight:700}
.sum{color:var(--mute);font-size:14px}
.sum b{color:var(--warn);font-weight:700}
nav{display:flex;gap:6px;padding:8px 18px}
nav button{flex:1;border:0;background:transparent;color:var(--mute);font:500 14px inherit;font-family:inherit;padding:9px;border-radius:10px}
nav button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
main{flex:1;overflow-y:auto;padding:4px 18px 16px}
.day{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top .d{font-weight:700}
.top .m{font-weight:700}
.top .x{border:0;background:none;color:var(--mute);font-size:18px;padding:0 0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 14px inherit;font-family:inherit}
.chip.paid{background:var(--accbg);border-color:transparent;color:var(--acc);text-decoration:line-through}
.chip.paid::before{content:"✓ ";text-decoration:none;display:inline-block}
.note{color:var(--mute);font-size:13px;margin-top:6px}
.per{color:var(--mute);font-size:13px}
.tag{font-size:12px;border-radius:6px;padding:2px 7px;background:var(--bg);color:var(--mute);margin-left:6px;font-weight:500}
.tag.debt{background:var(--warnbg);color:var(--warn)}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.person{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.person .r{display:flex;justify-content:space-between;align-items:center}
.person .n{font-weight:700}
.owe{font-weight:700;color:var(--warn)}.owe.ok{color:var(--acc)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.item{font-size:13px;color:var(--mute);display:flex;justify-content:space-between}
.btn{border:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 14px;font:700 13px inherit;font-family:inherit;margin-top:8px}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
footer{padding:8px 14px 12px;background:var(--card);border-top:1px solid var(--line)}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.quick .chip{white-space:nowrap;flex:none;padding:5px 11px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font:16px inherit;font-family:inherit}
input:focus{outline:2px solid var(--acc);border-color:transparent}
.go{border:0;background:var(--acc);color:var(--bg);width:48px;border-radius:12px;font-size:20px;font-weight:700}
.hint{font-size:12px;color:var(--mute);margin:6px 2px 0;min-height:17px}
.tpl{display:flex;gap:6px;overflow-x:auto;margin-top:8px}.tc{flex:none;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 10px;font-family:inherit;display:flex;flex-direction:column;gap:1px}.tc b{font-size:12px}.tc span{font-size:12px;color:var(--mute);white-space:nowrap}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}.seg button{flex:1;border:0;background:none;color:var(--mute);font-family:inherit;font-size:14px;padding:7px;border-radius:8px}.seg .on{background:var(--ink);color:var(--bg);font-weight:700}
.pn{display:flex;align-items:center;justify-content:space-between;margin:6px 0 8px}.pn button{border:0;background:none;color:var(--ink);font-size:26px;padding:0 14px;line-height:1}.pn button:disabled{color:var(--line)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.kpi div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.kpi small{display:block;color:var(--mute);font-size:12px}.kpi b{font-size:18px}.kpi .w{color:var(--warn)}.kpi .g{color:var(--acc)}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:6px}.bars i{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px}.bars i.z{background:var(--line)}
.lbl{display:flex;gap:3px;font-size:10px;color:var(--mute);margin-top:3px}.lbl span{flex:1;text-align:center}
code{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.hd{display:flex;justify-content:space-between;align-items:center}.hd h1{margin:0}
.day,.person,.kpi div{border:1px solid var(--ink);border-radius:4px}
.chip,.tc,.btn,.go,input,.seg,.seg button,nav button,.toast{border-radius:4px}
.chip{border:1px solid var(--ink);background:var(--bg)}
.chip.paid{background:var(--bg);color:var(--mute);border:1px dashed var(--mute)}
.go,.btn{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--ink)}
nav button{border:1px solid transparent}
nav button.on{box-shadow:none;border:1px solid var(--ink);background:var(--bg)}
.seg{border-color:var(--ink)}
.bar{height:4px;border-radius:0;background:var(--line)}.bar i{background:var(--ink)}
.bars i{background:var(--ink);border-radius:0}.bars i.z{background:var(--line)}
.tag{background:none;border:1px solid var(--ink);color:var(--ink)}.tag.debt{background:var(--ink);color:var(--bg)}
.owe.ok{color:var(--mute);font-weight:400}
.kpi .w,.kpi .g{color:var(--ink)}
footer{border-top:1px solid var(--ink)}
input{border:1px solid var(--ink)}input:focus{outline:2px solid var(--ink);outline-offset:1px}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header><div class="hd"><h1>Sổ Nợ</h1><button class="chip" data-t="data">Sao lưu</button></div><div class="sum" id="sum"></div></header>
  <nav><button data-t="log" class="on">Sổ</button><button data-t="owe">Ai nợ</button><button data-t="rep">Báo cáo</button><button data-t="help">Cách nhập</button></nav>
  <main id="main"></main>
  <footer>
    <div class="quick" id="quick"></div>
    <div class="row"><input id="inp" placeholder="vd: bách hiền trí 90k" autocomplete="off" enterkeyhint="send"><button class="go" id="go">↑</button></div>
    <div class="hint" id="hint"></div>
    <div class="tpl" id="tpl"></div>
  </footer>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>
<script>
const KEY="so-chi-v1";
const seed=()=>({members:[],entries:[],nid:1});
let S,tab="log",rp="week",off=0;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.entries)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");
const fmt=n=>n%1000===0?(n/1000).toLocaleString("vi-VN")+"k":(n/1000).toFixed(1).replace(".",",")+"k";
const today=()=>{const d=new Date();return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")};
const share=(e,x)=>{if(x&&x.v!=null)return x.v;const xs=e.ppl.reduce((s,y)=>s+(y.x||0),0);return (e.a-xs)/e.ppl.length+(x&&x.x||0)};

function owed(){ // per person unpaid
  const o={};
  S.entries.forEach(e=>{if(e.t==="split")e.ppl.forEach(x=>{if(!x.p){(o[x.n]=o[x.n]||[]).push({d:e.d,v:share(e,x),note:e.note})}})});
  return o;
}
function render(){
  const o=owed();
  let tot=0,cnt=0;
  Object.values(o).forEach(l=>{cnt++;l.forEach(i=>tot+=i.v)});
  const debts=S.entries.filter(e=>e.t==="debt"&&!e.paid).reduce((s,e)=>s+e.a,0);
  $("sum").innerHTML=tot||debts?`Chưa thu: <b>${fmt(Math.round(tot))}</b> từ ${cnt} người`+(debts?` · Công ty nợ: <b>${fmt(debts)}</b>`:""):"Không còn khoản nào chưa thu";
  $("quick").innerHTML=S.members.map(m=>`<button class="chip" data-add="${esc(m)}">${esc(m)}</button>`).join("")+`<button class="chip" data-newm>+ người</button>`;
  $("tpl").innerHTML=TPL(S.members).map((t,i)=>`<button class="tc" data-tpl="${i}"><b>${t[0]}</b><span>${esc(t[1])}</span></button>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  $("main").innerHTML=tab==="log"?renderLog():tab==="help"?renderHelp():tab==="rep"?renderReport():tab==="data"?renderData():renderOwe(o);
}
function renderLog(){
  if(!S.entries.length)return `<div class="empty">Chưa có khoản nào.<br>Gõ ở ô bên dưới, ví dụ: bách hiền trí 90k</div>`;
  return [...S.entries].reverse().map(e=>{
    let body="",tag="";
    if(e.t==="split"){
      body=`<div class="chips">${e.ppl.map((x,i)=>`<button class="chip ${x.p?"paid":""}" data-tog="${e.id}:${i}">${esc(x.n)}${x.v!=null?" "+fmt(Math.round(x.v)):x.x?" "+fmt(Math.round(share(e,x))):""}</button>`).join("")}</div>`;
      tag=`<span class="per">${e.ppl.some(x=>x.v!=null)?"chia riêng":e.ppl.some(x=>x.x)?"đều + thêm":fmt(Math.round(share(e)))+"/người"}</span>`;
    }else if(e.t==="debt"){
      body=`<div class="chips"><button class="chip ${e.paid?"paid":""}" data-tog="${e.id}:debt">Nợ ${esc(e.who)}</button></div>`;
      tag=`<span class="tag debt">nợ</span>`;
    }else tag=`<span class="tag">chi chung</span>`;
    return `<div class="day"><div class="top"><span><span class="d">${e.d}</span> ${tag}</span><span><span class="m">${fmt(e.a)}</span><button class="x" data-del="${e.id}" aria-label="Xóa">×</button></span></div>${body}${e.note?`<div class="note">${esc(e.note)}</div>`:""}</div>`;
  }).join("");
}
const TPL=m=>{const a=(m[0]||"A").toLowerCase(),b=(m[1]||"B").toLowerCase(),c=(m[2]||"C").toLowerCase();return[
["Chia đều",`${a} ${b} ${c} 90k`,"Tổng tiền chia đều cho mọi người được gọi tên."],
["Chia riêng",`${a} 35 ${b} 30 ${c} 40`,"Mỗi tên kèm số tiền của người đó. Tổng tự cộng."],
["Đều + thêm",`${a} ${b} ${c} +15k 90k`,"Gõ +số ngay sau tên người trả thêm. Tổng tiền gõ cuối dòng."],
["Có ngày",`16/11 ${a} ${b} 60k cơm gà`,"Ngày dd/mm đứng đầu, bỏ trống là hôm nay. Chữ còn lại là ghi chú."],
["Chi chung",`100k men rượu`,"Không có tên người: ghi vào chi chung, không tính nợ cho ai."],
["Nợ",`nợ mẹ 200k`,"Bắt đầu bằng nợ, rồi người hoặc nơi cho nợ, rồi số tiền. Chạm để đánh dấu đã trả."]]};
const yr=new Date().getFullYear();
const dt=e=>{const p=e.d.split("/").map(Number);return new Date(yr,p[1]-1,p[0])};
function range(){
  const n=new Date();n.setHours(0,0,0,0);
  if(rp==="month"){const s=new Date(n.getFullYear(),n.getMonth()+off,1),e=new Date(s.getFullYear(),s.getMonth()+1,0);return [s,e,`Tháng ${s.getMonth()+1}/${s.getFullYear()}`]}
  const s=new Date(n);s.setDate(n.getDate()-((n.getDay()+6)%7)+7*off);const e=new Date(s);e.setDate(s.getDate()+6);
  const f=d=>d.getDate()+"/"+(d.getMonth()+1);return [s,e,`Tuần ${f(s)} – ${f(e)}`];
}
function renderReport(){
  const [s,e2,label]=range();
  const L=S.entries.filter(x=>{const d=dt(x);return d>=s&&d<=e2});
  let chi=0,thu=0,chung=0,no=0;const pp={},days={};
  L.forEach(x=>{
    if(x.t==="debt"){no+=x.a;return}
    chi+=x.a;days[x.d]=(days[x.d]||0)+x.a;
    if(x.t==="general"){chung+=x.a;return}
    x.ppl.forEach(y=>{const v=share(x,y);const q=pp[y.n]=pp[y.n]||{t:0,p:0};q.t+=v;if(y.p){q.p+=v;thu+=v}});
  });
  const chia=chi-chung,chua=chia-thu;
  let h=`<div class="seg"><button class="${rp==="week"?"on":""}" data-rp="week">Tuần</button><button class="${rp==="month"?"on":""}" data-rp="month">Tháng</button></div>`;
  h+=`<div class="pn"><button data-off="-1" aria-label="Kỳ trước">‹</button><b>${label}</b><button data-off="1" ${off>=0?"disabled":""} aria-label="Kỳ sau">›</button></div>`;
  if(!L.length)return h+`<div class="empty">Chưa có khoản nào trong kỳ này.</div>`;
  h+=`<div class="kpi"><div><small>Tổng chi</small><b>${fmt(Math.round(chi))}</b></div><div><small>Chi chung</small><b>${fmt(Math.round(chung))}</b></div><div><small>Đã thu</small><b class="g">${fmt(Math.round(thu))}</b></div><div><small>Chưa thu</small><b class="w">${fmt(Math.round(chua))}</b></div></div>`;
  const ds=[];for(let d=new Date(s);d<=e2;d.setDate(d.getDate()+1)){ds.push(new Date(d))}
  const key=d=>String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
  const max=Math.max(1,...ds.map(d=>days[key(d)]||0));
  h+=`<div class="day"><div class="top"><span class="d">Chi theo ngày</span></div><div class="bars">${ds.map(d=>{const v=days[key(d)]||0;return `<i class="${v?"":"z"}" style="height:${Math.round(v/max*100)}%" title="${key(d)}: ${fmt(v)}"></i>`}).join("")}</div><div class="lbl">${ds.map(d=>`<span>${rp==="month"&&d.getDate()%5!==1?"":d.getDate()}</span>`).join("")}</div></div>`;
  const names=Object.keys(pp).sort((a,b)=>pp[b].t-pp[a].t);
  if(names.length)h+=`<div class="day"><div class="top"><span class="d">Theo người</span></div>`+names.map(n=>{const q=pp[n],c=Math.round(q.t-q.p);return `<div style="margin-top:10px"><div class="r" style="display:flex;justify-content:space-between"><span class="n">${esc(n)}</span><span>${fmt(Math.round(q.t))} · <span class="owe ${c?"":"ok"}">${c?"còn "+fmt(c):"đủ"}</span></span></div><div class="bar"><i style="width:${Math.round(q.p/q.t*100)}%"></i></div></div>`}).join("")+`</div>`;
  const gl=L.filter(x=>x.t==="general");
  if(gl.length)h+=`<div class="day"><div class="top"><span class="d">Chi chung</span></div>${gl.map(x=>`<div class="item" style="margin-top:6px"><span>${x.d} · ${esc(x.note||"khác")}</span><span>${fmt(x.a)}</span></div>`).join("")}</div>`;
  const dl=L.filter(x=>x.t==="debt");
  if(dl.length)h+=`<div class="day"><div class="top"><span class="d">Công ty nợ trong kỳ</span><span class="m">${fmt(no)}</span></div>${dl.map(x=>`<div class="item" style="margin-top:6px"><span>${x.d} · ${esc(x.who)} ${x.paid?"(đã trả)":""}</span><span>${fmt(x.a)}</span></div>`).join("")}</div>`;
  return h;
}
function renderHelp(){
  return `<div class="person"><div class="n">Quy chuẩn</div><div class="note">Một dòng là một khoản. Thứ tự: <b>ngày</b> (không bắt buộc), <b>tên hoặc số tiền</b>, <b>ghi chú</b> ở cuối dòng.</div><div class="note">Tiền: 90, 90k và 90000 đều là 90k. Tên không phân biệt hoa thường hay dấu. Người mới: bấm + người ở thanh tên trước khi gõ.</div></div>`+TPL(S.members).map((t,i)=>`<div class="person"><div class="r"><span class="n">${t[0]}</span><button class="btn ghost" style="margin:0" data-tpl="${i}">Dùng mẫu</button></div><div class="note" style="color:var(--ink)"><code>${esc(t[1])}</code></div><div class="note">${t[2]}</div></div>`).join("");
}
function renderOwe(o){
  const names=Object.keys(o).sort((a,b)=>o[b].reduce((s,i)=>s+i.v,0)-o[a].reduce((s,i)=>s+i.v,0));
  let h="";
  names.forEach(n=>{
    const sum=o[n].reduce((s,i)=>s+i.v,0);
    let totalAll=0;S.entries.forEach(e=>{if(e.t==="split")e.ppl.forEach(x=>{if(x.n===n)totalAll+=share(e,x)})});
    const pct=Math.round((1-sum/totalAll)*100);
    h+=`<div class="person"><div class="r"><span class="n">${esc(n)}</span><span class="owe">${fmt(Math.round(sum))}</span></div><div class="bar"><i style="width:${pct}%"></i></div>${o[n].map(i=>`<div class="item"><span>${i.d}${i.note?" · "+esc(i.note):""}</span><span>${fmt(Math.round(i.v))}</span></div>`).join("")}<button class="btn" data-remind="${esc(n)}">Copy tin nhắc</button></div>`;
  });
  const dl=S.entries.filter(e=>e.t==="debt"&&!e.paid);
  if(dl.length)h+=`<div class="person"><div class="r"><span class="n">Công ty đang nợ</span></div>${dl.map(e=>`<div class="item"><span>${e.d} · ${esc(e.who)}</span><span>${fmt(e.a)}</span></div>`).join("")}</div>`;
  return h||`<div class="empty">Mọi người đã trả đủ.</div>`;
}
function remind(n){
  const l=owed()[n]||[];const sum=Math.round(l.reduce((s,i)=>s+i.v,0));
  const txt=`${n} ơi, còn nợ ${fmt(sum)} nhé 🙏\n`+l.map(i=>`- ${i.d}: ${fmt(Math.round(i.v))}${i.note?" ("+i.note+")":""}`).join("\n");
  const done=()=>toast("Đã copy tin nhắn");
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>prompt("Copy tin nhắn:",txt));
  else prompt("Copy tin nhắn:",txt);
}
const AMT=/^(\d+(?:[.,]\d+)?)(k|tr|m)?$/i;
function toAmt(m){let v=parseFloat(m[1].replace(",","."));const u=(m[2]||"").toLowerCase();v=u==="tr"||u==="m"?v*1e6:(u==="k"||v<1000)?v*1000:v;return Math.round(v)}
function parse(raw){
  const toks=raw.trim().split(/\s+/).filter(Boolean);
  if(!toks.length)return null;
  let d=today(),amt=null,debt=false,names=[],rest=[],per={},ex={},amts=[];
  toks.forEach((t,i)=>{
    if(/^\d{1,2}\/\d{1,2}$/.test(t)){d=t.split("/").map(x=>x.padStart(2,"0")).join("/");return}
    const px=t.match(/^\+(\d+(?:[.,]\d+)?)(k|tr|m)?$/i);
    if(px&&names.length&&!debt){ex[names[names.length-1]]=toAmt(px);return}
    const m=t.match(AMT);
    if(m){amts.push(toAmt(m));return}
    if(norm(t)==="no"&&i<=1&&!debt){debt=true;return}
    const mem=S.members.find(x=>norm(x)===norm(t));
    if(mem&&!debt&&!names.includes(mem)){names.push(mem);
      const mm=(toks[i+1]||"").match(AMT);
      if(mm)per[mem]=toAmt(mm);
      return}
    rest.push(t);
  });
  const uneven=names.length&&names.every(n=>per[n]!=null);
  amt=uneven?names.reduce((s,n)=>s+per[n],0):(amts.length?amts[amts.length-1]:null);
  if(amt===null)return {err:"Thiếu số tiền, vd: 90k"};
  const id=S.nid++;
  if(debt)return {e:{id,d,a:amt,t:"debt",who:rest.join(" ")||"?",paid:false,note:""}};
  if(names.length)return {e:{id,d,a:amt,t:"split",ppl:names.map(n=>uneven?({n,p:false,v:per[n]}):({n,p:false,x:ex[n]||0})),note:rest.join(" ")}};
  return {e:{id,d,a:amt,t:"general",note:rest.join(" ")}};
}
function submit(){
  const r=parse($("inp").value);
  if(!r)return;
  if(r.err){$("hint").textContent=r.err;return}
  S.entries.push(r.e);save();$("inp").value="";$("hint").textContent="";tab="log";render();
  $("main").scrollTop=0;toast("Đã thêm");
}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1400)}
function preview(){
  const v=$("inp").value.trim();if(!v){$("hint").textContent="Gõ tên + số tiền. Thêm ngày (16/11) hoặc \"nợ mẹ 200k\" nếu cần.";return}
  const id0=S.nid;const r=parse(v);S.nid=id0;
  if(!r||r.err){$("hint").textContent=r?r.err:"";return}
  const e=r.e;
  $("hint").textContent=e.t==="split"?(e.ppl.some(x=>x.x)?`${e.d} · ${e.ppl.length} người · chia đều, thêm cho ${e.ppl.filter(x=>x.x).map(x=>x.n).join(", ")}`:e.ppl.some(x=>x.v!=null)?`${e.d} · ${e.ppl.length} người · tổng ${fmt(e.a)} (chia riêng)`:`${e.d} · ${e.ppl.length} người · ${fmt(Math.round(e.a/e.ppl.length))}/người`):e.t==="debt"?`${e.d} · nợ ${e.who} ${fmt(e.a)}`:`${e.d} · chi chung ${fmt(e.a)}`;
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  const D=b.dataset;
  if(D.t){tab=D.t;render();return}
  if(D.tog){const[id,i]=D.tog.split(":");const e=S.entries.find(x=>x.id==id);
    if(i==="debt")e.paid=!e.paid;else e.ppl[+i].p=!e.ppl[+i].p;save();render();return}
  if(D.del!==undefined){if(confirm("Xóa khoản này?")){S.entries=S.entries.filter(x=>x.id!=D.del);save();render()}return}
  if(D.add){const i=$("inp");i.value=(i.value?i.value.replace(/\s*$/," "):"")+D.add+" ";i.focus();preview();return}
  if(D.newm!==undefined){const n=(prompt("Tên người mới:")||"").trim();if(n&&!S.members.includes(n)){S.members.push(n);save();render()}return}
  if(D.act){act(D.act);return}
  if(D.remind){remind(D.remind);return}
  if(D.rp){rp=D.rp;off=0;render();return}
  if(D.off){off+=+D.off;render();return}
  if(D.tpl!==undefined){tab="log";render();const i=$("inp");i.value=TPL(S.members)[+D.tpl][1];i.focus();preview();return}
  if(b.id==="go")submit();
});
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submit()}});
$("inp").addEventListener("input",preview);
const pad=n=>String(n).padStart(2,"0");
const isoDay=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
async function saveFile(name,blob){
  const f=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title:name});return}catch(e){if(e.name==="AbortError")return}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function rowsAll(){
  const out=[];
  S.entries.forEach(e=>{
    const d=e.d+"/"+yr,note=e.note||"";
    if(e.t==="split")e.ppl.forEach(p=>out.push([d,"Chia tiền",p.n,Math.round(share(e,p)),p.p?"Đã trả":"Chưa trả",note,e.a]));
    else if(e.t==="general")out.push([d,"Chi chung","",e.a,"",note,e.a]);
    else out.push([d,"Nợ công ty",e.who,e.a,e.paid?"Đã trả":"Chưa trả",note,e.a]);
  });
  return out;
}
function periods(kind){
  const m={};
  S.entries.forEach(e=>{
    const d=dt(e);let k,l;
    if(kind==="month"){k=d.getFullYear()*100+d.getMonth();l=pad(d.getMonth()+1)+"/"+d.getFullYear()}
    else{const s=new Date(d);s.setDate(d.getDate()-((d.getDay()+6)%7));k=s.getTime();l="Tuần từ "+pad(s.getDate())+"/"+pad(s.getMonth()+1)+"/"+s.getFullYear()}
    const r=m[k]=m[k]||{k,l,chi:0,chung:0,thu:0,chua:0,no:0};
    if(e.t==="debt"){r.no+=e.a;return}
    r.chi+=e.a;
    if(e.t==="general"){r.chung+=e.a;return}
    e.ppl.forEach(p=>{const v=share(e,p);if(p.p)r.thu+=v;else r.chua+=v});
  });
  return Object.values(m).sort((a,b)=>a.k-b.k).map(r=>[r.l,Math.round(r.chi),Math.round(r.chung),Math.round(r.thu),Math.round(r.chua),Math.round(r.no)]);
}
function buildXlsx(){
  if(!window.XLSX)throw new Error("no xlsx");
  const wb=XLSX.utils.book_new();
  const add=(name,head,rows,w)=>{const ws=XLSX.utils.aoa_to_sheet([head].concat(rows));ws["!cols"]=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,name)};
  add("Sổ",["Ngày","Loại","Người","Số tiền (đ)","Trạng thái","Ghi chú","Tổng khoản (đ)"],rowsAll(),[12,12,14,14,12,26,15]);
  const o=owed(),nr=Object.keys(o).map(n=>[n,Math.round(o[n].reduce((s,i)=>s+i.v,0)),o[n].length]).sort((a,b)=>b[1]-a[1]);
  S.entries.filter(e=>e.t==="debt"&&!e.paid).forEach(e=>nr.push(["Công ty nợ "+e.who,e.a,1]));
  add("Ai nợ",["Người","Còn nợ (đ)","Số khoản chưa trả"],nr,[24,14,18]);
  const ph=["Kỳ","Tổng chi (đ)","Chi chung (đ)","Đã thu (đ)","Chưa thu (đ)","Công ty nợ (đ)"];
  add("Theo tuần",ph,periods("week"),[24,14,14,14,14,15]);
  add("Theo tháng",ph,periods("month"),[12,14,14,14,14,15]);
  return XLSX.write(wb,{type:"array",bookType:"xlsx"});
}
function renderData(){
  const lb=S.lb?`Sao lưu gần nhất: ${S.lb}`:"Chưa sao lưu lần nào";
  return `<div class="person"><div class="n">Sao lưu</div><div class="note">Lưu toàn bộ sổ (${S.entries.length} khoản, ${S.members.length} người) thành một file. Nên lưu định kỳ vì dữ liệu chỉ nằm trên máy này.</div><div class="note">${lb}</div><button class="btn" data-act="backup">Lưu file sao lưu</button></div>`
  +`<div class="person"><div class="n">Khôi phục</div><div class="note">Chọn file sao lưu đã lưu trước đó. Sổ hiện tại sẽ được thay bằng nội dung trong file.</div><button class="btn ghost" data-act="restore">Chọn file để khôi phục</button></div>`
  +`<div class="person"><div class="n">Xuất Excel</div><div class="note">File .xlsx gồm 4 trang: Sổ chi tiết, Ai nợ, Theo tuần, Theo tháng. Chỉ để xem và làm báo cáo, không dùng để khôi phục.</div><button class="btn" data-act="xlsx">Xuất file Excel</button></div>`;
}
function act(a){
  if(a==="backup"){
    saveFile(`so-no-sao-luu-${isoDay()}.json`,new Blob([JSON.stringify({app:"so-no",v:1,exported:new Date().toISOString(),data:S})],{type:"application/json"}));
    S.lb=today()+"/"+yr;save();render();
  }else if(a==="restore"){$("file").click()}
  else if(a==="xlsx"){
    try{saveFile(`so-no-bao-cao-${isoDay()}.xlsx`,new Blob([buildXlsx()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}))}
    catch(e){toast("Chưa tải được thư viện Excel")}
  }
}
function restore(f){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result),d=j&&j.data?j.data:j;
      if(!d||!Array.isArray(d.members)||!Array.isArray(d.entries))throw new Error("bad");
      if(!confirm(`Thay sổ hiện tại bằng file này (${d.entries.length} khoản)?`))return;
      d.nid=d.nid||(Math.max(0,...d.entries.map(e=>e.id||0))+1);
      S=d;save();tab="log";render();toast("Đã khôi phục");
    }catch(e){toast("File không hợp lệ")}
  };
  r.readAsText(f);
}
$("file").addEventListener("change",e=>{const f=e.target.files[0];if(f)restore(f);e.target.value=""});
render();preview();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
